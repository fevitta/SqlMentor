services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: sqlmentor-oracle
    environment:
      ORACLE_PASSWORD: SysPwd123
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - ./tests/integration/initdb:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    tmpfs:
      - /opt/oracle/oradata

  mariadb:
    image: mariadb:10.6
    container_name: sqlmentor-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: RootPwd123
    command: >
      --lower-case-table-names=0
      --performance-schema=ON
      --performance-schema-consumer-events-statements-current=ON
      --performance-schema-consumer-events-statements-history=ON
      --performance-schema-consumer-events-waits-current=ON
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - ./tests/integration/mariadb/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=RootPwd123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    tmpfs:
      - /var/lib/mysql
